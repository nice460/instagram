
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram sign up</title>
  <link rel="stylesheet" href="instagram-signup.css">
</head>
<body>

    <link rel="stylesheet" href="instagram-signup.css">
   <div class="container">
    <div class="signup-box">
      <h1>Instagram</h1>
      <p class="intro">
        sign up to see photos and videos from your friends.
      </p>

      <button class="facebook-btn">
        login with Facebook
     </button>

     <div class="or">
      <span></span>
      <p>OR</p>
      <span></span>
     </div>

     <form id="signupform">

      <input type="email" id="email" placeholder="email">

      <input type="text" id="fulname" placeholder="full Name">

      <input type="text" id="username" placeholder="username">

      <input type="password" id="password" placeholder="password">

      <button type="submit" class="signup-btn">
        sign up
      </button>
      </form>

      <p class="more">
        people who use our service may have uploaded 
        your contact information to instagram. <a href="#">learn more</a>

      </p>

      <p class="terms">
        By signing up, you agree to our terms privacy
        policy and cookies policy.
      </p>

      </div>

      <div class="login-box">
        Have an account?
        <a href="instagram.html">login</a>
       </div>
       </div>

  <script src="signupdemo.js"></script>
</body>
</html>
