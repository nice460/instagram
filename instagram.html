<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <link rel="stylesheet" href="instagram.css">

    <link rel="stylesheet" href="instagram-signup.css">
     <div class="box">
      <h1 class="logo">Instagram</h1>

      <div id="auth-message" class="message"></div>
      <form id="login-form">
        <input id="username" type="text" placeholder="Phone number, username, or email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button id="login"  type="submit" class="btn-login">Log in</button>
      </form>


        
    
       <div class="divider">
       <span>OR</span>
        
      </div>

      <a href="#" class="fb-login">Log in with Facebook</a>
      <a href="#" class="forgot-password">Forgot password?</a>
    </div>

    <!-- Sign Up Redirect Box -->
    <div class="box signup-box">
      Don't have an account? <a href="instagram-signup.html">Sign up</a>
    </div>

    <!-- App Download Section -->
    <div class="app-download">
      <p>Get the app.</p>
      <div class="badges">
        <a href="https://play.google.com/store/apps/details?id=com.instagram.android">
        <img src="https://static.vecteezy.com/system/resources/previews/027/179/379/original/google-play-icon-logo-symbol-free-png.png"  alt="Get it on Google Play">
        </a>

        <a id="msStoreBtn" href="https://apps.microsoft.com/detail/9nblggh5l9xt" target="_blank" rel="noopener noreferrer">
  <img src="https://images.seeklogo.com/logo-png/26/1/windows-10-icon-logo-png_seeklogo-267364.png?v=638663279420000000" alt="Get it from Microsoft">
</a>

      </div>

    
    </div>
  </div>


  <script src="instademo.js"></script>
</body>
</html>
